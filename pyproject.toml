[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fineprint"
version = "0.1.0"
description = "Offline policy, EOB and medical bill reconciliation with deterministic policy evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fineprint = "fineprint.server:main"

[tool.setuptools.packages.find]
include = ["fineprint*"]

[tool.setuptools.package-data]
fineprint = ["static/*", "samples/*/*"]
